<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘의 사무실</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/office.css">
<link rel="stylesheet" href="css/board.css">
<link rel="stylesheet" href="css/panel.css">
<link rel="stylesheet" href="css/markdown.css">
<link rel="stylesheet" href="css/changes.css">
<link rel="stylesheet" href="css/blackboard.css">
<link rel="stylesheet" href="css/meeting.css">
</head>
<body>
<header class="topbar">
  <h1>오늘의 사무실</h1>
  <div class="counters" role="group" aria-label="필터"></div><!-- buttons from views/filters.js FILTERS -->
  <button id="archive-open" class="icon-btn archive-btn" type="button" title="보관함" data-drop="archive">🗄️ 보관함</button>
  <button id="sound-toggle" class="icon-btn" type="button" aria-pressed="true" title="알림 소리">🔔</button>
</header>
<div class="stage">
  <div class="main-col">
    <section class="office" aria-label="사무실">
      <aside class="blackboard" id="blackboard" aria-label="오늘의 할 일"></aside><!-- views/blackboard.js -->
      <div class="split-x" id="split-blackboard"></div>
      <div class="office-decor">
        <svg id="window-svg" class="decor window" viewBox="0 0 100 70" aria-hidden="true">
          <rect x="2" y="2" width="96" height="66" rx="4" class="frame"/>
          <rect x="8" y="8" width="84" height="54" class="sky"/>
          <rect x="24" y="18" width="16" height="16" class="sun" fill="var(--sun)"/>
          <rect x="24" y="18" width="16" height="16" class="moon" fill="var(--moon)"/>
          <rect x="60" y="16" width="3" height="3" class="star" fill="var(--star)"/>
          <rect x="70" y="26" width="2" height="2" class="star" fill="var(--star)"/>
          <rect x="78" y="14" width="2" height="2" class="star" fill="var(--star)"/>
          <line x1="50" y1="8" x2="50" y2="62" class="mullion"/>
          <line x1="8" y1="35" x2="92" y2="35" class="mullion"/>
        </svg>
        <svg class="decor plant" viewBox="0 0 40 60" aria-hidden="true">
          <rect x="12" y="42" width="16" height="14" fill="var(--desk-edge)"/>
          <rect x="10" y="40" width="20" height="4" fill="var(--desk)"/>
          <rect x="14" y="18" width="6" height="24" fill="#6b8f57"/>
          <rect x="8" y="10" width="12" height="12" fill="#7fae63"/>
          <rect x="20" y="16" width="12" height="12" fill="#6b8f57"/>
          <rect x="14" y="4" width="12" height="12" fill="#8fc274"/>
        </svg>
        <!-- the way into the 회의실 (main.js [data-screen]); its twin in views/meeting.js leads back -->
        <button type="button" class="door" data-screen="meeting" title="회의실 들어가기">
          <svg class="door-svg" viewBox="0 -8 32 56" aria-hidden="true">
            <rect x="11" y="-7" width="10" height="5" rx="1" class="door-lamp"/><!-- lit while a meeting is on (views/office.js updateDoor) -->
            <rect x="15" y="-2" width="2" height="2" class="door-frame"/>
            <rect x="0" y="0" width="32" height="48" class="door-frame"/>
            <rect x="3" y="3" width="26" height="45" class="door-gap"/>
            <g class="door-leaf">
              <rect x="3" y="3" width="26" height="45" class="door-wood"/>
              <rect x="7.5" y="7.5" width="17" height="14" class="door-panel"/>
              <rect x="7.5" y="27.5" width="17" height="16" class="door-panel"/>
              <rect x="22" y="23" width="3" height="3" class="door-knob"/>
            </g>
          </svg>
          <span class="door-sign">회의실</span>
        </button>
      </div>
      <div class="desks" id="desks"></div>
      <section class="meeting" id="meeting" aria-label="회의실" hidden></section><!-- views/meeting.js -->
    </section>
    <div class="split-y" id="split-office"></div>
    <section class="kanban" aria-label="결재함">
      <h2>결재함</h2>
      <div class="kan-columns"></div><!-- columns from views/columns.js COLUMNS -->
    </section>
  </div>
</div>
<div class="panel-backdrop" id="panel-backdrop" aria-hidden="true"></div>
<aside class="panel" id="panel" aria-hidden="true">
  <div class="panel-resize-handle" id="panel-resize-handle" tabindex="0"></div>
  <button class="panel-close" id="panel-close" type="button" aria-label="닫기" title="닫기">✕</button>
  <div class="panel-head">
    <div class="panel-title"><span id="panel-animal" class="panel-animal"></span><strong id="panel-name"></strong></div>
    <div class="panel-sub" id="panel-sub"></div>
    <div class="panel-loc" id="panel-loc"></div>
    <div class="panel-diffstat hidden" id="panel-diffstat"></div>
  </div>
  <div class="panel-tabs">
    <button class="tab-btn active" data-tab="report" type="button">보고서</button>
    <button class="tab-btn" data-tab="diff" type="button">변경사항</button>
  </div>
  <div class="panel-body">
    <div class="stamp-layer" id="stamp-layer"></div>
    <div class="tab-pane" id="pane-report"></div>
    <div class="tab-pane hidden" id="pane-diff"></div>
  </div>
  <div class="panel-actions" id="panel-actions"></div>
</aside>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="animal-defs"></defs></svg>
<script type="module" src="js/main.js"></script>
<dialog id="archive-dialog" class="archive-dialog" aria-labelledby="archive-title">
  <div class="archive-head"><h2 id="archive-title">보관함</h2><button type="button" class="panel-close" id="archive-close" aria-label="닫기">✕</button></div>
  <div id="archive-body">
    <div id="archive-sessions"></div>
    <h3 class="archive-sub">지난 할 일</h3>
    <div id="archive-todos"></div><!-- views/archive.js, docs/specs/2026-09-29-todo-history-design.md §3.6 -->
  </div>
</dialog>
</body>
</html>
